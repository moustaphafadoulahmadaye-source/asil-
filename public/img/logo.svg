<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <!-- Emblem Gradients -->
    <linearGradient id="asilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#f2c230"/>
      <stop offset="100%" stop-color="#d49b10"/>
    </linearGradient>
    <linearGradient id="asilTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a30"/>
      <stop offset="100%" stop-color="#041417"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Hex-Shield Emblem Base -->
  <g filter="url(#logoGlow)">
    <rect x="3" y="4" width="42" height="42" rx="10" fill="url(#shieldBg)" stroke="rgba(242, 194, 48, 0.35)" stroke-width="1.2"/>
    
    <!-- Stylized Dynamic "A" Logistics Wings -->
    <!-- Left Wing -->
    <path d="M12 36L24 12L28 12L19 36H12Z" fill="url(#asilGold)"/>
    <!-- Right Wing / Forward Chevron -->
    <path d="M24 12L36 36H29L20 18L24 12Z" fill="url(#asilTeal)"/>
    <!-- Central Precision Compass Node / Cross-beam -->
    <polygon points="17,27 31,27 28.5,31 19.5,31" fill="#ffffff" opacity="0.95"/>
    <circle cx="24" cy="22" r="2.2" fill="#ffffff"/>
  </g>

  <!-- Premium Brand Typography -->
  <!-- "ASIL" in Bold White -->
  <text x="56" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="2.5">ASIL</text>
  
  <!-- "LOGISTICS" in Letter-Spaced Radiant Gold -->
  <text x="57" y="41" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="url(#asilGold)" letter-spacing="4.2">LOGISTICS</text>
</svg>
