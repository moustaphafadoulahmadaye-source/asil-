<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | ASIL Logistics</title>
  <meta name="theme-color" content="#0e3b43">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/asil-core.css?v=2.2">
  <link rel="stylesheet" href="/css/asil-app.css?v=3.1">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(25, 112, 101, 0.2) 0%, transparent 60%), #071f24;
      color: #ffffff;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .offline-card {
      max-width: 480px;
      width: 100%;
      background: rgba(14, 59, 67, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(242, 194, 48, 0.25);
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }
    .offline-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(242, 194, 48, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--asil-gold, #f2c230);
      color: var(--asil-gold, #f2c230);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      color: #071f24;
      background: linear-gradient(135deg, #f2c230 0%, #d49b10 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(242, 194, 48, 0.35);
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(242, 194, 48, 0.45);
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div style="margin-bottom:24px;">
      <img src="/img/logo.svg" alt="ASIL Logistics" style="height:42px;width:auto;">
    </div>
    <div class="offline-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Connection Unavailable</h1>
    <p>You are currently offline or experiencing a network interruption. Previously loaded pages and cached tracking data remain securely preserved on your device.</p>
    <button class="btn-retry" id="retryBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Try Again
    </button>
    <div class="status-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Awaiting network reconnection...</span>
    </div>
  </div>

  <script src="/js/offline.js"></script>
</body>
</html>
